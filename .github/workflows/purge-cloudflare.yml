name: PURGE CLOUDFLARE DEPLOYMENTS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: capclair
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Purge old Cloudflare Pages deployments
        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo " CLOUDFLARE PAGES PURGE"
          echo "========================================"
          echo
          echo "Project: $PROJECT_NAME"
          echo

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "[ERROR] CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "[ERROR] CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          API_ROOT="https://api.cloudflare.com/client/v4"
          API_BASE="$API_ROOT/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME"
          DEPLOYMENTS_URL="$API_BASE/deployments"

          mkdir -p /tmp/cf-purge
          : > /tmp/cf-purge/deployments.jsonl

          echo "Checking Cloudflare project..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/cf-purge/project.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_BASE")

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "[ERROR] Cloudflare project check failed."
            echo "HTTP status: $HTTP_CODE"
            echo
            cat /tmp/cf-purge/project.json | jq . || cat /tmp/cf-purge/project.json
            exit 1
          fi

          if ! jq -e '.success == true' /tmp/cf-purge/project.json > /dev/null; then
            echo
            echo "[ERROR] Cloudflare API rejected the project request:"
            cat /tmp/cf-purge/project.json | jq .
            exit 1
          fi

          echo "[OK] Project found."
          echo

          echo "Fetching deployment list..."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/cf-purge/page.json \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$DEPLOYMENTS_URL")

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "[ERROR] Unable to list deployments."
            echo "HTTP status: $HTTP_CODE"
            echo
            cat /tmp/cf-purge/page.json | jq . || cat /tmp/cf-purge/page.json
            exit 1
          fi

          if ! jq -e '.success == true' /tmp/cf-purge/page.json > /dev/null; then
            echo
            echo "[ERROR] Cloudflare rejected deployment listing:"
            cat /tmp/cf-purge/page.json | jq .
            exit 1
          fi

          jq -c '.result[]' /tmp/cf-purge/page.json \
            >> /tmp/cf-purge/deployments.jsonl

          TOTAL_PAGES=$(jq -r '.result_info.total_pages // 1' /tmp/cf-purge/page.json)
          PER_PAGE=$(jq -r '.result_info.per_page // 20' /tmp/cf-purge/page.json)
          TOTAL_COUNT=$(jq -r '.result_info.total_count // (.result | length)' /tmp/cf-purge/page.json)

          echo "Deployments reported: $TOTAL_COUNT"
          echo "Results per page:     $PER_PAGE"
          echo "Pages:                $TOTAL_PAGES"

          if [ "$TOTAL_PAGES" -gt 1 ]; then
            for PAGE in $(seq 2 "$TOTAL_PAGES"); do

              echo "Fetching page $PAGE/$TOTAL_PAGES..."

              HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --output /tmp/cf-purge/page.json \
                --write-out "%{http_code}" \
                --request GET \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$DEPLOYMENTS_URL?page=$PAGE")

              if [ "$HTTP_CODE" != "200" ]; then
                echo
                echo "[ERROR] Failed to fetch page $PAGE."
                echo "HTTP status: $HTTP_CODE"
                echo
                cat /tmp/cf-purge/page.json | jq . || cat /tmp/cf-purge/page.json
                exit 1
              fi

              if ! jq -e '.success == true' /tmp/cf-purge/page.json > /dev/null; then
                echo
                echo "[ERROR] Cloudflare rejected page $PAGE:"
                cat /tmp/cf-purge/page.json | jq .
                exit 1
              fi

              jq -c '.result[]' /tmp/cf-purge/page.json \
                >> /tmp/cf-purge/deployments.jsonl
            done
          fi

          ACTUAL_COUNT=$(wc -l < /tmp/cf-purge/deployments.jsonl)

          echo
          echo "Collected: $ACTUAL_COUNT deployments"
          echo
          echo "Keeping newest deployment of every branch..."

          jq -s -r '
            sort_by(.deployment_trigger.metadata.branch // "__unknown__")
            | group_by(.deployment_trigger.metadata.branch // "__unknown__")
            | map(
                sort_by(.created_on)
                | reverse
                | .[1:]
              )
            | flatten
            | .[].id
          ' /tmp/cf-purge/deployments.jsonl \
            > /tmp/cf-purge/delete_ids.txt

          DELETE_COUNT=$(wc -l < /tmp/cf-purge/delete_ids.txt)
          KEEP_COUNT=$((ACTUAL_COUNT - DELETE_COUNT))

          echo
          echo "Deployments kept:     $KEEP_COUNT"
          echo "Deployments to purge: $DELETE_COUNT"

          if [ "$DELETE_COUNT" -eq 0 ]; then
            echo
            echo "Nothing to delete."
            exit 0
          fi

          echo
          echo "Deleting up to 10 deployments simultaneously..."
          echo

          export DEPLOYMENTS_URL
          export CLOUDFLARE_API_TOKEN

          delete_deployment() {
            DEPLOYMENT_ID="$1"

            for ATTEMPT in 1 2 3; do

              RESPONSE_FILE="/tmp/cf-delete-$DEPLOYMENT_ID.json"

              HTTP_CODE=$(curl \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out "%{http_code}" \
                --request DELETE \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$DEPLOYMENTS_URL/$DEPLOYMENT_ID?force=true") || HTTP_CODE="000"

              if [ "$HTTP_CODE" = "200" ] && \
                 jq -e '.success == true' "$RESPONSE_FILE" > /dev/null 2>&1; then

                echo "[OK] $DEPLOYMENT_ID"
                rm -f "$RESPONSE_FILE"
                return 0
              fi

              echo "[RETRY $ATTEMPT/3] $DEPLOYMENT_ID - HTTP $HTTP_CODE"

              if [ -s "$RESPONSE_FILE" ]; then
                jq -c '.errors // .' "$RESPONSE_FILE" 2>/dev/null || \
                  cat "$RESPONSE_FILE"
              fi

              sleep $((ATTEMPT * 2))
            done

            echo "[FAILED] $DEPLOYMENT_ID"
            return 1
          }

          export -f delete_deployment

          xargs \
            -r \
            -P 10 \
            -n 1 \
            bash -c 'delete_deployment "$1"' _ \
            < /tmp/cf-purge/delete_ids.txt

          echo
          echo "========================================"
          echo " CLOUDFLARE PURGE COMPLETED"
          echo "========================================"
          echo
          echo "Deleted: $DELETE_COUNT"
          echo "Kept:    $KEEP_COUNT"
